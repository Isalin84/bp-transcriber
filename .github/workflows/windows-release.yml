name: Windows release

# Единственный workflow репозитория: Windows-установщик нельзя собрать на Mac.
# Тесты здесь не гоняются — они локальные (scripts/check.sh, хук pre-push).
#
# Тег v* -> сборка setup.exe, selftest собранного приложения, загрузка в релиз этого тега
# и публикация релиза. Если релиза ещё нет, он создаётся из packaging/release-notes-template.md.
# DMG для macOS собирается локально и докладывается в тот же релиз (см. packaging/README.md).
# Ручной запуск (workflow_dispatch) только собирает установщик в артефакты запуска.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: windows-release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  PYTHONUTF8: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  # md5 модели v3_e2e_rnnt из gigaam._MODEL_HASHES (пин GigaAM в requirements/gigaam.txt); меняется вместе с моделью.
  GIGAAM_MODEL_KEY: gigaam-v3_e2e_rnnt-2730de7545ac43ad256485a462b0a27a

jobs:
  build:
    name: Сборка Windows x64
    runs-on: windows-2022
    timeout-minutes: 120
    outputs:
      version: ${{ steps.ver.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements/lock-win-x64.txt
            requirements/gigaam.txt

      - name: Зависимости из lock-файла
        shell: bash
        env:
          PIP_EXTRA_INDEX_URL: https://download.pytorch.org/whl/cpu
        run: |
          python -m pip install -r requirements/lock-win-x64.txt
          python -m pip install --no-deps -r requirements/gigaam.txt
          python -m pip install --no-deps -e .

      - name: Версия
        id: ver
        shell: bash
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          version="$(python -c "import bp_transcriber; print(bp_transcriber.__version__)")"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Версия приложения: $version"
          if [ "$REF_TYPE" = "tag" ] && [ "$REF_NAME" != "v$version" ]; then
            echo "::error::Тег $REF_NAME не совпадает с bp_transcriber.__version__ ($version)."
            exit 1
          fi

      - name: LGPL ffmpeg
        shell: pwsh
        run: ./packaging/windows/fetch_ffmpeg.ps1

      # Модель нужна только для selftest (GigaAM на CPU). Кэш в ~/.cache/gigaam:
      # model_store.models_root() сам берёт этот каталог, если там лежит ckpt.
      - name: Кэш модели GigaAM
        id: model-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/gigaam
          key: ${{ env.GIGAAM_MODEL_KEY }}

      - name: Скачивание модели GigaAM (как в приложении)
        if: steps.model-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        shell: bash
        run: |
          python - <<'PY'
          import shutil
          from pathlib import Path

          from gigaam_transcriber.model_store import ensure_model

          root = Path(ensure_model())
          legacy = Path.home() / ".cache" / "gigaam"
          if root.resolve() != legacy.resolve():
              legacy.mkdir(parents=True, exist_ok=True)
              for item in root.glob("v3_e2e_rnnt*"):
                  shutil.copy2(item, legacy / item.name)
          print("модель готова:", sorted(p.name for p in legacy.iterdir()))
          PY

      - name: Сборка приложения (PyInstaller)
        shell: bash
        run: python packaging/build_app.py --clean

      - name: Selftest собранного приложения
        shell: pwsh
        run: |
          # Окно-приложение (GUI subsystem) может не иметь stdout - отчёт всегда дублируется в лог BP_HOME/logs.
          $env:BP_HOME = Join-Path $env:RUNNER_TEMP 'bp-selftest-home'
          New-Item -ItemType Directory -Force -Path $env:BP_HOME | Out-Null
          $exe = Join-Path $PWD 'dist\BP Transcriber\BP Transcriber.exe'
          $p = Start-Process -FilePath $exe -ArgumentList '--selftest' -Wait -PassThru -NoNewWindow `
               -RedirectStandardOutput selftest.log -RedirectStandardError selftest.err.log
          Get-Content selftest.log, selftest.err.log -ErrorAction SilentlyContinue
          $logDir = Join-Path $env:BP_HOME 'logs'
          if (Test-Path $logDir) {
            Copy-Item $logDir selftest-logs -Recurse
            Get-Content (Join-Path $logDir 'bp-transcriber.log') -Tail 120 -ErrorAction SilentlyContinue
          }
          Write-Host "--- selftest exit code: $($p.ExitCode) ---"
          exit $p.ExitCode

      - name: Лог selftest (при падении)
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: selftest-log
          path: |
            selftest.log
            selftest.err.log
            selftest-logs/
          if-no-files-found: ignore

      - name: WebView2 bootstrapper
        shell: pwsh
        run: |
          $dir = 'packaging/windows/redist'
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          $file = Join-Path $dir 'MicrosoftEdgeWebview2Setup.exe'
          Invoke-WebRequest -Uri 'https://go.microsoft.com/fwlink/p/?LinkId=2124703' -OutFile $file -MaximumRedirection 5
          $sig = Get-AuthenticodeSignature $file
          if ($sig.Status -ne 'Valid' -or $sig.SignerCertificate.Subject -notmatch 'Microsoft') {
            throw "Подпись WebView2 bootstrapper недействительна: $($sig.Status) / $($sig.SignerCertificate.Subject)"
          }
          if ((Get-Item $file).Length -lt 500KB) { throw 'WebView2 bootstrapper подозрительно мал' }

      - name: Установщик (Inno Setup)
        shell: pwsh
        env:
          APP_VERSION: ${{ steps.ver.outputs.version }}
        run: |
          $iscc = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          if (-not (Test-Path $iscc)) {
            choco install innosetup -y --no-progress
            if ($LASTEXITCODE -ne 0) { throw 'choco install innosetup не удался' }
          }
          if (-not (Test-Path $iscc)) { throw "ISCC.exe не найден: $iscc" }
          $defs = @(python packaging/windows/prepare_wizard_images.py)
          if ($LASTEXITCODE -ne 0) { throw 'prepare_wizard_images.py завершился с ошибкой' }
          & $iscc "/DAppVersion=$env:APP_VERSION" "/DRequireWebView2" @defs packaging\windows\bp_transcriber.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC завершился с кодом $LASTEXITCODE" }
          $setup = "dist\BP-Transcriber-$env:APP_VERSION-windows-x64-setup.exe"
          if (-not (Test-Path $setup)) { throw "Установщик не создан: $setup" }
          Write-Host "Готово: $setup ($([math]::Round((Get-Item $setup).Length / 1MB, 1)) МБ)"

      - uses: actions/upload-artifact@v7
        with:
          name: installer-windows-x64
          path: dist/BP-Transcriber-*-setup.exe
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

  release:
    name: Публикация релиза
    needs: build
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ github.ref_name }}
      VERSION: ${{ needs.build.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: installer-windows-x64
          path: artifacts

      - name: Установщик, SHA256SUMS и публикация
        shell: bash
        run: |
          set -euo pipefail
          exe="artifacts/BP-Transcriber-${VERSION}-windows-x64-setup.exe"
          test -f "$exe"
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            sed -e "s/{{VERSION}}/${VERSION}/g" -e "s/{{TAG}}/${TAG}/g" \
                packaging/release-notes-template.md > release-notes.md
            gh release create "$TAG" --draft --verify-tag --title "BP Transcriber $TAG" --notes-file release-notes.md
          fi
          # SHA256SUMS: строки других платформ (DMG) сохраняем, строку Windows заменяем
          gh release download "$TAG" --pattern SHA256SUMS.txt --output old-sums.txt 2>/dev/null || touch old-sums.txt
          grep -v 'windows-x64-setup.exe' old-sums.txt > SHA256SUMS.txt || true
          (cd artifacts && sha256sum "$(basename "$exe")") >> SHA256SUMS.txt
          cat SHA256SUMS.txt
          gh release upload "$TAG" "$exe" SHA256SUMS.txt --clobber
          gh release edit "$TAG" --draft=false --latest
