[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gigaam-transcriber"
version = "1.0.0.dev0"
description = "Микробиблиотека для транскрипции аудио/видео на базе GigaAM с диаризацией спикеров"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "GigaAM Transcriber"}
]
keywords = [
    "transcription",
    "speech-to-text",
    "asr",
    "gigaam",
    "russian",
    "diarization",
    "pyannote",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

# GigaAM itself is installed separately (see requirements/gigaam.txt) with --no-deps to avoid onnx/onnxruntime.
dependencies = [
    "torch==2.11.*",
    "torchaudio==2.11.*",
    "hydra-core==1.3.*",
    "omegaconf==2.3.*",
    "numpy>=2,<3",
    "soundfile",
    "sentencepiece",
    "tqdm>=4.65.0",
    "click>=8.0.0",
    "huggingface_hub>=0.20.0",
    "platformdirs>=4",
    "silero-vad>=5.1",
    "pydub>=0.25.0",
]

[project.optional-dependencies]
diarization = [
    "pyannote.audio==4.0.*",
    "speechbrain>=1.0.0",
    "scikit-learn>=1.3.0",
]
app = [
    "pywebview>=6,<7",
    "bottle>=0.13",
    "keyring>=25",
    "python-docx>=1.1",
    "Pillow>=10",
]
build = [
    "pyinstaller>=6.11",
]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "black>=23.0.0",
    "mypy>=1.0.0",
    "ruff>=0.1.0",
]
all = [
    "gigaam-transcriber[diarization,app,dev]",
]

[project.scripts]
bp-transcriber = "bp_transcriber.app:main"
gigaam-transcribe = "gigaam_transcriber.cli:main"
gigaam-batch = "gigaam_transcriber.cli:batch_main"

[project.urls]
Homepage = "https://github.com/Isalin84/bp-transcriber"
Repository = "https://github.com/Isalin84/bp-transcriber"
Upstream = "https://github.com/yaruslove/DialogScribe"

[tool.setuptools.packages.find]
where = ["."]
include = ["gigaam_transcriber*", "bp_transcriber*"]

[tool.setuptools.package-data]
"*" = ["*.yaml", "*.json"]
"bp_transcriber" = ["ui/**/*"]

[tool.black]
line-length = 100
target-version = ['py310', 'py311', 'py312']
include = '\.pyi?$'
exclude = '''
/(
    \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
  | GigaAM
)/
'''

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "B", "C4", "UP"]
ignore = ["E501", "B008"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "requires_gpu: marks tests that require GPU",
    "requires_hf_token: marks tests that require HuggingFace token",
]
